name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Build & Package Desktop Release
        shell: pwsh
        env:
          BASE_URL: '/'
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/pack-release.ps1 -OutputDir artifacts

      - name: Verify release package
        shell: pwsh
        run: |
          $expectedZip = 'R.I.I.C-Calculator-Windows-x64-Portable.zip'
          $zips = @(Get-ChildItem -LiteralPath artifacts -File -Filter '*.zip')
          if ($zips.Count -ne 1 -or $zips[0].Name -ne $expectedZip) {
            throw "Expected exactly one release ZIP named $expectedZip; found: $($zips.Name -join ', ')"
          }
          $hash = (Get-FileHash -LiteralPath "artifacts/$expectedZip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSum = "$hash  $expectedZip"
          $actualSum = (Get-Content -LiteralPath artifacts/SHA256SUMS.txt -Raw).Trim()
          if ($actualSum -ne $expectedSum) {
            throw 'SHA256SUMS.txt does not match the release ZIP'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "artifacts/$expectedZip"))
          try {
            $index = $archive.GetEntry('R.I.I.C-Calculator/dist/index.html')
            if ($null -eq $index) { throw 'Release ZIP is missing dist/index.html' }
            $reader = [IO.StreamReader]::new($index.Open())
            try { $html = $reader.ReadToEnd() } finally { $reader.Dispose() }
            foreach ($match in [regex]::Matches($html, '(?:src|href)="([^"?#]+)"')) {
              $url = [Uri]::new([Uri]'https://app.riic/index.html', $match.Groups[1].Value)
              if ($url.Host -ne 'app.riic') { continue }
              $entryPath = 'R.I.I.C-Calculator/dist' + $url.AbsolutePath
              if ($null -eq $archive.GetEntry($entryPath)) { throw "Missing desktop resource: $entryPath" }
            }
            $duplicates = @($archive.Entries | Group-Object FullName | Where-Object Count -gt 1)
            if ($duplicates.Count -gt 0) { throw 'Release ZIP contains duplicate paths' }
            $publicRoot = (Resolve-Path -LiteralPath public).Path
            foreach ($file in Get-ChildItem -LiteralPath $publicRoot -File -Recurse -Force) {
              $relative = [IO.Path]::GetRelativePath($publicRoot, $file.FullName).Replace('\', '/')
              if ($null -eq $archive.GetEntry('R.I.I.C-Calculator/dist/' + $relative)) {
                throw "Release ZIP lost or renamed public asset: $relative"
              }
            }
          } finally { $archive.Dispose() }

      - name: Resolve Release Tag
        id: resolve_tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          $tag = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $env:INPUT_TAG
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            "commit-$env:GITHUB_SHA"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Resolved release tag: $tag"

      - name: Upload Release Artifacts to Workflow Run
        uses: actions/upload-artifact@v6
        with:
          name: release-artifacts
          path: |
            artifacts/R.I.I.C-Calculator-Windows-x64-Portable.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Tag the pushed commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.createRef({
                owner, repo, ref: `refs/tags/${tag}`, sha: context.sha,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              const { data: existing } = await github.rest.git.getRef({
                owner, repo, ref: `tags/${tag}`,
              });
              if (existing.object.type !== 'commit' || existing.object.sha !== context.sha) {
                throw new Error(`Tag ${tag} already points to another object`);
              }
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            artifacts/R.I.I.C-Calculator-Windows-x64-Portable.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || inputs.prerelease) }}
          token: ${{ secrets.GITHUB_TOKEN }}
