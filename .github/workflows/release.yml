name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Build & Package Desktop Release
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/pack-release.ps1 -OutputDir artifacts

      - name: Resolve Release Tag
        id: resolve_tag
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag_name }}"
          $refTag = "${{ github.ref_name }}"
          $tag = if (-not [string]::IsNullOrWhiteSpace($inputTag)) { $inputTag } else { $refTag }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Resolved release tag: $tag"

      - name: Upload Release Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            artifacts/R.I.I.C-Calculator-Windows-x64-Portable.zip
            artifacts/ArcIncCalc-Windows-x64-Portable.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            artifacts/R.I.I.C-Calculator-Windows-x64-Portable.zip
            artifacts/ArcIncCalc-Windows-x64-Portable.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'push' || inputs.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
